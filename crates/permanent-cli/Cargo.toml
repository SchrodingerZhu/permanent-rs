[package]
name = "permanent-cli"
description = "Command line and terminal dashboard of the permanent estimator"
version.workspace = true
edition.workspace = true

[[bin]]
name = "permanent"
path = "src/main.rs"

[features]
default = ["rayon", "wgpu"]
# The engines to build in; --backend picks one at run time.
rayon = ["dep:permanent-rayon"]
# Any GPU that wgpu reaches: Vulkan, Metal, DirectX.
wgpu = ["dep:permanent-wgpu"]
# Build with `cargo oxide build -- --profile cuda --features cuda`.
cuda = ["dep:permanent-cuda"]
# One rank per GPU or node under `mpirun`.
mpi = ["permanent-core/mpi"]

[dependencies]
permanent-core.workspace = true
permanent-rayon = { workspace = true, optional = true }
permanent-cuda = { workspace = true, optional = true }
permanent-wgpu = { workspace = true, optional = true }
anyhow.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
rayon.workspace = true
tracing.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = "0.1.52"
ratatui = "0.30.2"

# No terminal to draw on: the dashboard's types build, its event loop does not.
[target.'cfg(target_family = "wasm")'.dependencies]
ratatui = { version = "0.30.2", default-features = false }
