[package]
name = "permanent-wgpu"
description = "Engine that keeps the population on a GPU through wgpu"
version.workspace = true
edition.workspace = true

[dependencies]
permanent-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The WGSL path only: what a browser runs too. Minor versions of CubeCL
# change its interfaces, so the version is exact.
cubecl = { version = "=0.11.4", default-features = false, features = ["std", "wgpu"] }

[dev-dependencies]
permanent-rayon.workspace = true
