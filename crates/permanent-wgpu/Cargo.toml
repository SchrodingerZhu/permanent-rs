[package]
name = "permanent-wgpu"
description = "Engine that keeps the population on a GPU through wgpu"
version.workspace = true
edition.workspace = true

[dependencies]
permanent-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
fixed.workspace = true
web-time.workspace = true
rayon.workspace = true
# The WGSL path only: what a browser runs too. Minor versions of CubeCL
# change its interfaces, so the version is exact.
cubecl = { version = "=0.11.4", default-features = false, features = ["std", "wgpu"] }

[dev-dependencies]
permanent-rayon.workspace = true

# In a browser the system generator of CubeCL's dependencies is JavaScript's.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
