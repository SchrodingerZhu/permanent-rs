[package]
name = "permanent-core"
description = "The permanent estimator: scaling, schedule, plan and the engine trait"
version.workspace = true
edition.workspace = true

[features]
# Reductions across MPI ranks. Needs an MPI implementation at build time.
mpi = ["dep:mpi"]

[dependencies]
anyhow.workspace = true
rand.workspace = true
rand_core = "0.10.1"
rayon.workspace = true
tracing.workspace = true
num-traits.workspace = true
fixed.workspace = true
web-time.workspace = true
# only the block function: the crate's own generator buffers 64 words
rand_philox = { version = "0.2.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sprs = { version = "0.11.6", default-features = false }
mpi = { version = "0.8", optional = true }
