[package]
name = "permanent"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["vulkan"]
# CubeCL over WGSL/Vulkan - the portable default.
vulkan = ["cubecl/vulkan"]
# Route the CubeCL kernels through NVRTC/CUDA instead of WGSL/Vulkan. Build
# with `--no-default-features --features cuda` so the wgpu runtime is not
# compiled in at all - a compiled-in Vulkan runtime still probes for adapters
# at startup and panics its discovery thread on machines with no usable ICD.
# Enabling `cubecl/cuda` on the dependency alone does NOT flip the backend:
# src/gpu_markov_chain.rs selects the runtime by this crate feature.
cuda = ["cubecl/cuda"]
# Hand-written CUDA kernels driven through cuRAND. Needs nvcc at build time
# and an NVIDIA driver at run time; see build.rs.
native-cuda = ["dep:cudarc"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cubecl = {
    version = "0.10.0",
    default-features = false,
    features = ["std"],
}
rand = { version = "0.10.2" }
# Matches the feature set cubecl-cuda selects, so the two share one build of
# cudarc. `fallback-dynamic-loading` dlopens libcuda.so at run time instead of
# linking it, which is what lets a native-cuda build still start (and fail with
# a real message) on a machine with no NVIDIA driver.
cudarc = { version = "0.19.9", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "fallback-dynamic-loading",
    "cuda-version-from-build-system",
    "fallback-latest",
] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
simd-json = "0.17.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
stacker = "0.1.25"
mimalloc = "0.1.52"
ratatui = "0.30.2"
malachite = {
    version = "0.10.0",
    default-features = false,
    features = ["naturals_and_integers"],
}

[profile.release]
lto = "thin"
debug = true
