[workspace]
resolver = "3"
members = ["crates/*"]
# permanent-cuda needs the CUDA toolkit and `cargo oxide`; it is built only
# through the `cuda` feature of permanent-cli.
default-members = ["crates/permanent-core", "crates/permanent-rayon", "crates/permanent-wgpu", "crates/permanent-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
permanent-core = { path = "crates/permanent-core" }
permanent-rayon = { path = "crates/permanent-rayon" }
permanent-cuda = { path = "crates/permanent-cuda" }
permanent-wgpu = { path = "crates/permanent-wgpu" }
anyhow = "1.0.104"
# without the system generator, which wasm32-unknown-unknown lacks; the
# command line, which draws seeds from it, turns it on
rand = { version = "0.10.2", default-features = false, features = ["std"] }
rayon = "1.12.0"
tracing = "0.1.44"
num-traits = "0.2.19"
fixed = "1.31"
web-time = "1.1"

[profile.release]
lto = "thin"
debug = true

# For `cargo oxide build -- --profile cuda --features cuda`: the object that
# carries the device code has no bitcode, so the link cannot use LTO.
[profile.cuda]
inherits = "release"
lto = "off"
