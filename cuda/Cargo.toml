[package]
name = "permanent-cuda"
version = "0.2.0"
edition = "2024"

# Built with cuda-oxide (https://github.com/NVIDIA/cuda-rust), not plain
# cargo: `cargo oxide build`. Kept out of the parent crate so that one still
# builds with any toolchain.
[workspace]

[features]
mpi = ["permanent/mpi"]

[dependencies]
permanent = { path = ".." }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git" }
# Has to come from the same repository as cuda-host, which depends on it.
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git" }
anyhow = "1.0.104"
rand = { version = "0.10.2" }
rayon = "1.12.0"
mimalloc = "0.1.52"
tracing = "0.1.44"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cuda_kernel)'] }

[profile.release]
lto = "thin"
